# Basket: 1-minute candles. Runs every minute.
name: "minute"
enabled: true
folder: "data_minute"                  # under output.root
kite_interval: "minute"
bar_minutes: 1
instruments:                           # which kinds to collect
  index: true
  futures: true
  options: true
overrides:
  options:
    # 3 expiries x 102 contracts = 306 requests (~110 s at 2.8/s): more than one minute allows, so not all three can be fetched every
    # minute. Expiry 2 (next week) is the contract the strategy trades, so it is fetched EVERY minute (~36 s); the other two every 6th
    # minute (staggered 3 minutes apart), each catching up on all bars since its last fetch. Every 6th minute the cycle is longer
    # (~75 s); nothing is lost, the next cycle just starts when it ends.
    # To trade another expiry, give that code {code: N} and the others `every: 6`.
    expiries:
      - {code: 1, every: 6, phase: 0}
      - {code: 2}
      - {code: 3, every: 6, phase: 3}
